# Security lane (README §16): static analysis, dependency vulnerabilities,
# secret scanning, and CI-config hardening. Runs on PRs (non-blocking except
# where noted) and nightly with the deep scans.
name: Security

on:
  pull_request:
  schedule:
    - cron: '17 3 * * *'   # nightly, off-peak
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, rust]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild (Rust needs cargo metadata hint)
        if: matrix.language == 'rust'
        working-directory: rust
        run: cargo build --workspace
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rust-dependency-audit:
    name: Rust advisories + licenses (audit / deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit / cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo deny check (licenses, bans, sources)
        working-directory: rust
        run: cargo deny check
      - name: cargo audit (RustSec advisories)
        working-directory: rust
        run: cargo audit

  python-dependency-audit:
    name: Python advisories (pip-audit) + bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: pip install pip-audit bandit
      - name: pip-audit (requirements)
        run: pip-audit -r requirements.txt -r requirements-dev.txt
      - name: Bandit SAST
        run: bandit -c pyproject.toml -r kpi/tools tests

  workflow-hardening:
    name: Actionlint + zizmor (CI config itself)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: reviewdog/action-actionlint@v1
      - name: zizmor (GitHub Actions supply-chain analysis)
        uses: zizmor-corps/zizmor-action@0db5b364a000eb178e71113c9d7a42bd8be05257  # pinned SHA per README §16
        with:
          args: --min-severity medium .github/workflows
