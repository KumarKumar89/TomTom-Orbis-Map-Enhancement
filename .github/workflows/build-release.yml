# Release lane (README §10 / §17): tag-triggered build of binaries, Python
# wheel (maturin), container image, SBOM + attestation, GitHub Release.
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Re-run PR gate before releasing
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    name: Rust binaries (${{ matrix.target }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cross-linker for aarch64-linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI (release)
        working-directory: rust
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p cli --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: orbis-cli-${{ matrix.target }}
          path: rust/target/${{ matrix.target }}/release/orbis-cli
      - name: Package tarball + SHA256
        run: |
          cd rust/target/${{ matrix.target }}/release
          tar czf ../../../orbis-cli-${{ matrix.target }}.tar.gz orbis-cli
          cd ../../..
          sha256sum orbis-cli-${{ matrix.target }}.tar.gz > orbis-cli-${{ matrix.target }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-archive-${{ matrix.target }}
          path: |
            rust/orbis-cli-${{ matrix.target }}.tar.gz
            rust/orbis-cli-${{ matrix.target }}.sha256

  python-wheel:
    name: maturin wheel (py-bridge)
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel from feature-gated PyO3 crate
        working-directory: rust/crates/py-bridge
        run: maturin build --release --features python --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: rust/crates/py-bridge/dist/*

  container:
    name: Container image + SBOM + attestation
    needs: [quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write    # artifact attestations
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/orbis-cli
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Trivy image scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/orbis-cli:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Syft SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/orbis-cli:${{ github.sha }}
          format: spdx-json
          output-file: orbis-cli-SBOM.spdx.json
      - name: Attest build provenance + SBOM
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/orbis-cli
          subject-digest: ${{ steps.meta.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: orbis-cli-SBOM.spdx.json

  kpi-release-gate:
    name: KPI gate (--require-all) before release
    needs: [binaries, python-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Release pipeline treats un-instrumented gated KPIs as blockers
      # (kpi_report.py docstring: --require-all once emitters are wired).
      - name: Full KPI gate
        run: python3 kpi/tools/kpi_report.py --require-all
      - name: Alerts (release-blocking on CRITICAL)
        run: python3 kpi/tools/alert_thresholds.py

  github-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, python-wheel, container, kpi-release-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
