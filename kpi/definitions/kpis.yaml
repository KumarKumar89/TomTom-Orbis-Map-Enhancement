# =============================================================================
# TOMTOM ORBIS MAP ENHANCEMENT — KPI MASTER DEFINITIONS
# =============================================================================
# 92 domain-specific KPIs across 20 categories, plus the infrastructure /
# performance KPI baseline already enforced by CI (Criterion + pytest-benchmark
# budgets, quality-gate exit codes) integrated as `infra_performance`.
#
# Every KPI is reviewed as: Ideal Target vs Actual, with threshold status.
#
# direction : higher | lower   (whether higher actual values are better)
# ideal     : aspirational target ("Ideal Target" column of every review)
# pass      : actual meeting this => PASS (green)
# warn      : actual meeting this but not `pass` => WARN (amber);
#             worse than this => FAIL (red)
# unit      : free-text unit for rendering
# source    : measurement owner (engine / pipeline stage emitting the metric)
# review    : cadence for regular reviews: ci | daily | weekly | monthly | nightly
# gate      : true => participates in the automated CI/CD pass/fail gate
#
# Status model (single source of truth: kpi/tools/kpi_report.py):
#   PASS | WARN | FAIL | MISSING(no measurement recorded yet)
# =============================================================================
meta:
  version: 1
  contract: "canonical MapFeature contract v1 (rust/crates/geo-core)"
  categories: 20
  domain_kpis: 92
  infra_kpis_baseline: 8

